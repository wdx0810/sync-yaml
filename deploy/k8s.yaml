---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yaml-sync-data
  namespace: devops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-nfs-storage-rutspnfs
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaml-sync
  namespace: devops
  labels:
    app: yaml-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yaml-sync
  template:
    metadata:
      labels:
        app: yaml-sync
    spec:
      containers:
        - name: yaml-sync
          image: swr.cn-east-3.myhuaweicloud.com/test-devops/yaml-sync:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/auth/login
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/auth/login
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yaml-sync-data

---
apiVersion: v1
kind: Service
metadata:
  name: yaml-sync
  namespace: devops
spec:
  selector:
    app: yaml-sync
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
